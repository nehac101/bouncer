[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bouncer-ratelimit"
version = "0.1.0"
description = "Redis-backed sliding window rate limiter middleware for FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "starlette",
    "redis>=4.2",
]
